name: zerodue
description: ZeroDue Android companion — captures payment SMS and forwards them for one-tap categorisation.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  http: ^1.6.0
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
