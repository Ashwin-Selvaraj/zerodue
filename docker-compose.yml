name: zerodue

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zerodue
      POSTGRES_PASSWORD: zerodue
      POSTGRES_DB: zerodue
      TZ: Asia/Kolkata
    ports:
      - '5432:5432'
    volumes:
      - zerodue_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zerodue -d zerodue']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zerodue_pgdata:
